version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_password
      POSTGRES_DB: factory_calendar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_calendar"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      - DATABASE_URL=postgresql://factory_user:factory_password@db:5432/factory_calendar?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://factory_user:factory_password@db:5432/factory_calendar?schema=public
      - NODE_ENV=production
      - HOMER_WEB_URL=${HOMER_WEB_URL:-http://localhost:8922}
      - HOMER_WEB_API_KEY=${HOMER_WEB_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data: